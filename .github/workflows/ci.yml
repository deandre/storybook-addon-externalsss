name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:complexity
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook
      - name: Install Chromium
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:ci
      - run: pnpm test:composition

  compatibility:
    name: Compatibility (${{ matrix.fixture }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - 9.0-react18-vite
          - 9.latest-vue-vite
          - 10.0-react19-webpack
          - 10.6.0-react19-vite
          - 10.latest-vue-vite
          - 10.latest-react18-webpack
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        timeout-minutes: 15
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:compatibility
        env:
          EXTERNALSSS_COMPAT_CASE: ${{ matrix.fixture }}
          # The Ubuntu runner uses glibc; make npm's native dependency selection explicit.
          npm_config_libc: glibc
